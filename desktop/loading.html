<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>OpenDesign</title>
  <style>
    html,body{margin:0;height:100%;background:#f7f5f0;color:#3a3a3a;font:15px "Microsoft YaHei UI",system-ui,sans-serif}
    body{display:flex;align-items:center;justify-content:center;-webkit-app-region:drag}
    .box{text-align:center}.dot{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:#264653;animation:b 1.2s infinite}
    .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
    @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
  </style>
</head>
<body data-ui="loading"><div class="box"><p>OpenDesign 正在启动…</p><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></body>
</html>
