# 发版(aiwork 改造 · 阶段 B;计划见 SunJ1ayu/aiwork 的 WORKFLOW-MIGRATION-PLAN.md,规则 D1)。
#
# 防的误放行:用没合进 main 的代码打包发布;agent 自己把版本发出去。
# 删掉会怎样:撤掉本机的业主凭证后就发不了版,会逼着把凭证放回去,身份分离(I1)随之失效。
#
# 流程(installer/RELEASE.md 是给人看的版本):
#   check   只在 main 上跑;environment `release` 的保护是齐的;两处版本号一致;tag v<版本> 还不存在(同一版本不发两次)
#   e2e     整跑 electron-e2e(Linux 组包 + 云 Windows E1～E7),任何一条 FAIL 都到不了下一步
#   publish 停在 environment `release` 等业主在 GitHub 上批准;批准后核字节、改写 latest.yml、再核,
#           用 release-feed.mjs 生成的那组实参建正式 release,tag 打在本次构建的提交上
#
# environment `release` 在仓库设置里建:审批人是业主(`.aiwork/policy.json` 的 owner);部署分支只许 main。
# 谁都可以点「Run workflow」(业主或有写权限的 agent),真正发出去只认业主那一下批准。
#
# 名字写错或被删掉时,GitHub 会在 publish 那一刻**自动建一个没有任何保护的同名 environment**,
# 不等批准直接发出去(第一次建成了 `aiwork`,实际发生过)。所以 check 先核它存在、审批人是业主、
# 部署分支只有 main;缺一样就在构建之前红,什么都不发。

name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - name: 只在 main 上发
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::发版只能在 main 上跑,这次是 $GITHUB_REF"
          exit 1

      - uses: actions/checkout@v4

      - name: environment release 的保护是齐的
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 业主是谁只在 policy 里定义(关卡也读它);上一步只许 main,读到的是 main 上那份
          APPROVER=$(jq -er '.owner' .aiwork/policy.json)
          api="repos/$GITHUB_REPOSITORY/environments/release"
          if ! envj=$(gh api "$api"); then
            echo "::error::读不到 environment \`release\`(没建?)—— 没有它,发版会不等批准直接发出去。到仓库 Settings → Environments 建它(见 installer/RELEASE.md)"
            exit 1
          fi
          pol=$(gh api "$api/deployment-branch-policies" || echo '{}')
          ok=$(jq -n --argjson e "$envj" --argjson p "$pol" --arg who "$APPROVER" '
            ([$e.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?
              | select(.type == "User") | .reviewer.login] | any(. == $who))
            and ($e.deployment_branch_policy.custom_branch_policies == true)
            and ([$p.branch_policies[]? | "\(.type // "branch"):\(.name)"] == ["branch:main"])')
          if [ "$ok" != "true" ]; then
            echo "::error::environment \`release\` 的保护不齐:要审批人 $APPROVER、部署分支只许 main"
            echo "$envj" | jq '{protection_rules, deployment_branch_policy}'
            echo "$pol" | jq '.branch_policies'
            exit 1
          fi

      - id: v
        name: 版本号与 tag
        run: |
          ver=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' bin/ds_web.py)
          pkg=$(node -p "require('./desktop/package.json').version")
          if [ -z "$ver" ] || [ "$ver" != "$pkg" ]; then
            echo "::error::bin/ds_web.py VERSION($ver)与 desktop/package.json version($pkg)不一致"
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$ver")" ]; then
            echo "::error::tag v$ver 已经存在 —— 先合一个改版本号的发版 PR 再来发"
            exit 1
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "发 $ver,构建提交 $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/electron-e2e.yml

  publish:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      VER: ${{ needs.check.outputs.ver }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: rel

      - name: 核字节 → 改写 latest.yml → 再核 → 建 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe="rel/OpenDesign-$VER-electron-setup.exe"
          mkdir feed
          node desktop/scripts/release-feed.mjs verify rel/latest.yml "$exe"
          node desktop/scripts/release-feed.mjs rewrite rel/latest.yml feed/latest.yml "$VER"
          node desktop/scripts/release-feed.mjs verify feed/latest.yml "$exe"
          node desktop/scripts/release-feed.mjs gh-command "$VER" "$exe" "$exe.blockmap" feed/latest.yml --target "$GITHUB_SHA" --run

      - name: 回显:版本 + 构建提交 + 资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git ls-remote origin "refs/tags/v$VER" | cut -f1)
          {
            echo "### OpenDesign $VER"
            echo "- 构建提交:\`$GITHUB_SHA\`"
            echo "- tag v$VER 指向:\`$tag\`"
            echo '- 资产:'
            gh release view "v$VER" --json assets --jq '.assets[] | "  - \(.name)(\(.size) 字节)"'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$tag" != "$GITHUB_SHA" ]; then
            echo "::error::tag v$VER 指向 $tag,不是构建提交 $GITHUB_SHA"
            exit 1
          fi
