# PR 上的自动检查(aiwork 改造 · 阶段 A;计划见 SunJ1ayu/aiwork 的 WORKFLOW-MIGRATION-PLAN.md,规则 R2)。
#
# 防的误放行:没测过的代码进 main;测试结果只靠 Builder 在 PR 评论里自述(PR #6 的状态:check runs = 0)。
# 删掉会怎样:PR 上重新没有机器产出的测试结果,main 的分支规则也就没有可要求的检查。
#
# 跑的就是本地收货那一条 `tests/run-all.sh`(泄漏闸自测 / node 单测 / python 全量 + 死断言闸 /
# MCP 契约闸 / dist 新鲜度 + 类型检查 / e2e),不另写一份检查清单。和本机不同的三处环境都在下面显式给:
#   · Python 3.12(死断言闸用 sys.monitoring,3.12 才有):建 venv,装与 bin/install.ps1 相同的钉版本依赖,PY= 指过去;
#   · e2e 的 playwright-core 与 Chromium:钉 1.58.2(本机现用版本),E2E_PW_MODULES 指过去;
#   · 无出口守卫要 root 才能 `unshare -n` ⇒ 总跑用 sudo 以 root 跑(本机也是 root)。
#
# 退出码:CI 上必有 4 条没跑,run-all.sh 因此返回 3("没红,但有没跑的,不算通过"):
#   · python 2 条:1 条 Windows 专属(本机同样跳过);1 条 test_ws_protocol_smoke —— 它连本机常开的活 gateway,
#     CI 上没有 gateway 就整份跳过(本机有 gateway 时会跑,所以本机只跳 1 条);
#   · e2e 2 条:new_chat / project-thread 要活 gateway(见 tests/e2e/README.md)。
# 三条要 gateway 的都要真模型 key,CI 不给 secrets、也不该联网调模型,所以只能在本机跑。
# 这里**只在没跑的恰好是 4 条时放行**;多一条没跑就红(SKIP 不算 PASS)。
# 以后这个数变了,改下面的 EXPECTED_NOT_RUN 并在提交说明里写清是哪条、为什么。
#
# 拉完整历史(fetch-depth: 0):test_desktop_config C5 用 `git show win-installer-0.98.8:…` 读已发布的旧更新器,
# 默认的单提交浅检出不带 tag,这条会红、它后面两条断言也就成了死断言(第三跑实测)。
#
# 不做路径过滤:必过的检查被跳过时,GitHub 会把"跳过"当成通过。
# 不给 secrets:pull_request 事件跑的是 PR 自己的代码。

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PW_VERSION: "1.58.2"
      EXPECTED_NOT_RUN: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Python 依赖(与 bin/install.ps1 同一组钉版本)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet nanobot-ai==0.2.2 mcp==1.28.1 firecrawl-anydoc==0.1.6

      - name: 前端依赖
        run: |
          # web/package-lock.json 的 217 个下载地址全是本机所在云的内网镜像 mirrors.tencentyun.com,
          # GitHub 的机器连不上(npm 卡住后以 "Exit handler never called" 崩掉,首跑实测)。
          # 只在 CI 里临时换成官方源的同一路径;锁文件的 integrity 不变、npm ci 逐包校验,
          # 装到的仍是锁文件钉死的那一份。装完还原锁文件,工作树与提交保持一致。
          sed -i 's#http://mirrors.tencentyun.com/npm/#https://registry.npmjs.org/#g' web/package-lock.json
          npm ci --prefix web --no-audit --no-fund
          git checkout -- web/package-lock.json

      - name: Playwright ${{ env.PW_VERSION }} 与 Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund "playwright-core@$PW_VERSION"
          npx --yes "playwright@$PW_VERSION" install --with-deps chromium

      - name: 总跑 tests/run-all.sh
        run: |
          # 以 root 跑的 git 要认这个由 runner 用户检出的工作树
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          out="$RUNNER_TEMP/run-all.txt"
          set +e
          sudo env "PATH=$PATH" "HOME=$HOME" \
            "PY=$RUNNER_TEMP/venv/bin/python" \
            "E2E_PW_MODULES=$RUNNER_TEMP/pw/node_modules" \
            bash tests/run-all.sh 2>&1 | tee "$out"
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo '### tests/run-all.sh'
            echo '```'
            sed -n '/总跑汇总/,$p' "$out" | sed 's/\x1b\[[0-9;]*m//g'
            echo "command-rc: $rc"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq 3 ] && grep -qF "但有 ${EXPECTED_NOT_RUN} 条没跑" "$out"; then
            echo "没有红的;没跑的恰好是预期的 ${EXPECTED_NOT_RUN} 条(python:Windows 专属 1 条 + 要活 gateway 的 ws 冒烟 1 条;e2e:要活 gateway 的 2 条)⇒ 通过"
            exit 0
          fi
          if [ "$rc" -eq 3 ]; then
            echo "::error::没有红的,但没跑的条数不是预期的 ${EXPECTED_NOT_RUN} 条 —— SKIP 不算 PASS,查上面的汇总"
          else
            echo "::error::tests/run-all.sh 退出码 $rc"
          fi
          # run-all.sh 把各段细节写进 /tmp 下的日志目录,红了才保留;runner 一收工就没了。
          # 这里把红的那几段日志直接印进 job 日志:先印红了的那几条测试(node 的 `not ok`、python 的 FAIL / ERROR,
          # 各带后面 40 行的报错),再印末尾 —— 只印末尾时,几百条里红的那一条多半不在末尾,
          # 上传的日志构件在本机那边又常下不下来,等于没留线索(PR #10 @ 224f338 实际发生过)。
          # e2e 段里每条红了的场景另有自己的日志,也一并印出。
          for f in $(sed -n 's/.*→ \(\/tmp\/[^ ]*\.log\)$/\1/p' "$out"); do
            echo "::group::$f 里红了的测试(最多 20 条)"
            sudo grep -E -A 40 -m 20 '^[[:space:]]*not ok |^(FAIL|ERROR): ' "$f" || true
            echo "::endgroup::"
            echo "::group::$f(末尾 200 行)"
            sudo tail -n 200 "$f" || true
            echo "::endgroup::"
            for g in $(sudo grep -ohE '/tmp/[^ ]+\.e2e\.(mjs|py)\.log' "$f" | sort -u || true); do
              echo "::group::$g(末尾 120 行)"
              sudo tail -n 120 "$g" || true
              echo "::endgroup::"
            done
          done
          # 完整目录拷出来给 runner 用户,下一步作为构件上传(原目录是 root 建的 700,上传步骤读不了)。
          mkdir -p "$RUNNER_TEMP/run-all-logs"
          sudo cp -r /tmp/ds-all-* /tmp/ds-leakprobe-* "$RUNNER_TEMP/run-all-logs/" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/run-all-logs"
          exit 1

      - name: 上传红了的日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-all-logs
          path: ${{ runner.temp }}/run-all-logs
          if-no-files-found: ignore
          retention-days: 7
