# Electron 换壳探路(track opendesign-electron-shell,U2 的 E1/E2/E3)。**不是回归判据。**
#
# E1 构建:electron-builder 把 Electron 外壳 + 免装 Python(现有组包流水线产出)打成 NSIS 安装包,量大小与耗时。
# E3 过渡:真装旧版 0.98.x、在托盘里跑着 → 静默装新包 → 核目录/卸载项/资料/开机自启/桌面图标。
# E2 起窗:Playwright 把装好的新版真跑起来,点三个按钮、关窗进托盘、再双击叫回、退出、硬杀主进程。
# E4 更新:再造一版 0.98.11,替身更新源(本机 http,支持单段 Range)上放它;0.98.10 在后台跑着时
#         经 electron-updater 下载并装上,量实际下载字节(增量省多少)。
# 绿只代表探针跑完且机器能判的那几条过了;截图由主 agent 看。
#
# 跑法:推到 ci-electron/** 分支。⚠️ 前缀故意不是 ci-probe/**(那会顺带触发另外两支探针)。

name: electron-shell-probe

on:
  push:
    branches: ['ci-electron/**']

permissions:
  contents: read

jobs:
  payload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 组 Python 包(现有出货流水线,--app 形态)
        run: bash tracks/opendesign-windows-installer/spike/build-package.sh out --app

      - name: 打成一个 zip(一万多个小文件直接传太慢)
        run: cd out && zip -qr pkg.zip pkg && ls -la pkg.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: out/pkg.zip
          retention-days: 3

  probe:
    needs: payload
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pkg
          path: artifact

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: E1 构建
        working-directory: tracks/opendesign-electron-shell/spike/app
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Expand-Archive ..\..\..\..\artifact\pkg.zip -DestinationPath . -Force
          Copy-Item ..\..\..\..\installer\opendesign.ico build\icon.ico
          npm install --no-audit --no-fund
          if ($LASTEXITCODE) { throw "npm install rc=$LASTEXITCODE" }
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE) { throw "electron-builder rc=$LASTEXITCODE" }
          "E1 构建耗时 $([int]$sw.Elapsed.TotalSeconds)s"
          Get-ChildItem dist\*.exe | ForEach-Object { "E1 安装包 $($_.Name) $([math]::Round($_.Length/1MB,1)) MB" }
          $u = Get-ChildItem dist\win-unpacked -Recurse -File
          "E1 解开后 $($u.Count) 个文件 / $([math]::Round(($u | Measure-Object Length -Sum).Sum/1MB,1)) MB"
          Move-Item dist dist-v1

      - name: E4 准备:再造一版 0.98.11,摆进替身更新源目录
        working-directory: tracks/opendesign-electron-shell/spike/app
        run: |
          npm pkg set version=0.98.11
          # 像一次真实发版那样改点代码:后端一个 .py、前端一个打包后的 js(增量下载量才有参考价值)
          Add-Content pkg\ds\bin\ds_web.py "`n# probe: 0.98.11 的代码改动"
          $js = Get-ChildItem pkg\ds\web\dist\assets\*.js | Select-Object -First 1
          Add-Content $js.FullName "`n/* probe: 0.98.11 的前端改动 */"
          "  改了:pkg\ds\bin\ds_web.py、$($js.Name)"
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE) { throw "electron-builder(v2) rc=$LASTEXITCODE" }
          New-Item -ItemType Directory -Force upd | Out-Null
          Copy-Item dist\latest.yml, dist\*.exe, dist\*.blockmap upd\
          Copy-Item dist-v1\*.blockmap upd\
          Get-ChildItem upd | ForEach-Object { "  upd\$($_.Name) $($_.Length)" }
          Get-Content upd\latest.yml

      - name: E3 过渡 + E2 起窗 + E4 更新
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem tracks\opendesign-electron-shell\spike\app\dist-v1\*.exe | Select-Object -First 1).FullName
          .\tracks\opendesign-electron-shell\spike\probe\electron-shell-probe.ps1 `
            -NewSetup $setup `
            -AppDir (Resolve-Path tracks\opendesign-electron-shell\spike\app).Path `
            -UpdDir (Resolve-Path tracks\opendesign-electron-shell\spike\app\upd).Path `
            -OutDir probe-out

      - name: 把图和日志交出来
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-shell-probe
          path: probe-out
          retention-days: 7
