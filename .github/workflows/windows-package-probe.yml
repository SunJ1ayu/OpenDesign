# 真安装包探针:把业主真正双击的那个 45MB 包搬上云 Windows 机器走一遍。
#
# 上一支探针(windows-gui-probe)只答"这台机器有没有屏幕、画不画得出窗口";
# 这一支答的才是那句要紧的:**我们的软件在上面装得上、打得开、界面在不在。**
#
# 🔴 一次性探路,**不是回归判据**:绿只代表探针跑完了。
#    八相的结果在日志 VERDICT 段 + 构件里的截图和 外壳.log 上,由主 agent 看图下结论。

name: windows-package-probe

on:
  push:
    branches: ['ci-probe/**']
  # 🔴 默认值 = **push 到 ci-probe/** 分支时用的那个**(那条路没有 inputs)。
  #    它会过期:2026-08-30 深夜发现还停在 0.97.0,而当前发布是 0.98.2 ⇒
  #    改探针后推分支验证,跑的其实是三个版本前的安装包。**发新版时顺手改这里。**
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag'
        default: 'win-installer-0.98.2'
      asset:
        description: '安装包文件名'
        default: 'OpenDesign-Setup-0.98.2.exe'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 下载 → 静默装 → 启动 → 截图 → 收日志
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\.github\scripts\windows-package-probe.ps1 `
            -Tag "${{ github.event.inputs.tag || 'win-installer-0.98.2' }}" `
            -Asset "${{ github.event.inputs.asset || 'OpenDesign-Setup-0.98.2.exe' }}" `
            -OutDir probe-out

      # 🔴 **退出闸的第二条路,故意住在这个文件里**(2026-08-31,第六轮 panel)。
      #    探针末尾那道闸读的是它自己进程内的 $phases。外部评审实测:在闸前面补一行
      #    `$phases = @{}`、或者在 Get-Verdict 的 return 里多一个 `-replace "FAIL",""`,
      #    任何事故都整趟绿,而 50 条本机判据全绿。**一条路的闸,改一处就没了。**
      #    这一步读的是判定器写下的**退出码**收据,和上面那步不在同一个文件、
      #    不在同一种判断上 —— 绕过去要同时改两处。
      #    `if: always()` 不能省:探针被绕过时的样子恰恰是 exit 0,而它真红时这一步
      #    也得跑完把收据打出来。
      - name: 裁决收据独立复核
        if: always()
        shell: pwsh
        run: |
          $f = 'probe-out/verdicts.tsv'
          if (-not (Test-Path $f)) {
              "🔴 没有裁决收据 $f ⇒ 探针没跑到落账那一步,这一趟不算过"
              exit 1
          }
          $lines = @(Get-Content $f)
          "裁决收据 $($lines.Count) 行:"
          $lines | ForEach-Object { "  $_" }
          $bad = @($lines | Where-Object { $_ -like "1`t*" })
          if ($bad.Count) {
              "🔴 收据里有 $($bad.Count) 条 FAIL 裁决 ⇒ 这一趟不算过"
              exit 1
          }
          "收据里没有 FAIL 裁决"

      - name: 把图和日志交出来
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-probe
          path: |
            probe-out/*.png
            probe-out/*.log
            probe-out/*.zip
            probe-out/*.tsv
          if-no-files-found: warn
