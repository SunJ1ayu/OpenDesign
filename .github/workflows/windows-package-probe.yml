# 真安装包探针:把业主真正双击的那个 45MB 包搬上云 Windows 机器走一遍。
#
# 上一支探针(windows-gui-probe)只答"这台机器有没有屏幕、画不画得出窗口";
# 这一支答的才是那句要紧的:**我们的软件在上面装得上、打得开、界面在不在。**
#
# 🔴 一次性探路,**不是回归判据**:绿只代表探针跑完了。
#    八相的结果在日志 VERDICT 段 + 构件里的截图和 外壳.log 上,由主 agent 看图下结论。

name: windows-package-probe

on:
  push:
    branches: ['ci-probe/**']
  # 🔴 默认值 = **push 到 ci-probe/** 分支时用的那个**(那条路没有 inputs)。
  #    它会过期:2026-08-30 深夜发现还停在 0.97.0,而当前发布是 0.98.2 ⇒
  #    改探针后推分支验证,跑的其实是三个版本前的安装包。**发新版时顺手改这里。**
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag'
        default: 'win-installer-0.98.2'
      asset:
        description: '安装包文件名'
        default: 'OpenDesign-Setup-0.98.2.exe'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 下载 → 静默装 → 启动 → 截图 → 收日志
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\.github\scripts\windows-package-probe.ps1 `
            -Tag "${{ github.event.inputs.tag || 'win-installer-0.98.2' }}" `
            -Asset "${{ github.event.inputs.asset || 'OpenDesign-Setup-0.98.2.exe' }}" `
            -OutDir probe-out

      - name: 把图和日志交出来
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-probe
          path: |
            probe-out/*.png
            probe-out/*.log
            probe-out/*.zip
          if-no-files-found: warn
