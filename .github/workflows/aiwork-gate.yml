# aiwork 放行关卡(阶段 C;计划见 SunJ1ayu/aiwork 的 WORKFLOW-MIGRATION-PLAN.md,规则 G1–G8、M1)。
#
# 防的误放行:没测过、没独立评审、自己审自己、改了 CI 或关卡自己、高风险只一家审过的 PR 被合进 main。
# 删掉会怎样:放不放行又回到靠人看评论区自述。
#
# 为什么这样触发(M1):
#   · pull_request_target / workflow_run 跑的永远是 main 上的这份 workflow 和 .github/aiwork-gate/ 代码,
#     PR 改关卡、改策略都改不到正在判它的这一份;这里也**不检出 PR 的代码**,只读 GitHub API。
#   · workflow_run:CI 跑完、有新评审(aiwork-review-ping)时重算;给 PR 加 `aiwork:recheck` 标签也能手动重算。
#   · edited:只改 PR 的目标分支时 head 不变、改动文件却变了,也要重算(改标题正文时顺带重算一次,无害)。
#   · 发检查结果用 aiwork-gate App 的私钥,放在只许 main 用的 environment `aiwork-gate` 里:
#     同仓库分支的 PR 能拿到仓库级 secrets,拿不到只许 main 的 environment secrets。
#   · 唯一的写权限 statuses: write 给保险丝(commit status `aiwork-gate/fuse`):App 私钥坏了时 App 改不了
#     自己发过的旧 success,由保险丝挡住(见 .github/aiwork-gate/run.mjs 文件头)。
#
# 先以 `aiwork-gate-shadow` 这个名字只报不拦(.aiwork/policy.json 的 check_name);
# 判得准了,再改名 `aiwork-gate` 并在 main 的分支规则里设为必过、限定只认 aiwork-gate App,
# 同时把保险丝 `aiwork-gate/fuse` 也设为必过(步骤见 .github/aiwork-gate/README.md)。

name: aiwork-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, edited]
  workflow_run:
    workflows: [ci, aiwork-review-ping]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: write

concurrency:
  group: aiwork-gate-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'aiwork:recheck'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aiwork-gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 判
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AIWORK_GATE_PRIVATE_KEY: ${{ secrets.AIWORK_GATE_PRIVATE_KEY }}
        run: node .github/aiwork-gate/main.mjs
