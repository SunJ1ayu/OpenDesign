# aiwork 放行关卡。判定代码在 SunJ1ayu/aiwork 的 gate/，策略在本仓库 main 的 .aiwork/policy.json。
# 计划在 git 历史里。用法见 gate/README.md。
#
# 防的误放行:没测过、没独立评审、自己审自己、改了 CI 或关卡自己、高风险只一家审过的 PR 被合进 main。
# 删掉会怎样:放不放行又回到靠人看评论区自述。
#
# 为什么这样触发(M1):
#   · pull_request_target / workflow_run 跑的是本仓库 main 上的这份 workflow。
#     关卡代码另从 SunJ1ayu/aiwork 的 main 检出，策略只读本仓库 main 上的 .aiwork/policy.json。
#     PR 改 workflow、改策略、改关卡都改不到正在判它的这一份。这里不检出 PR 的代码，只读 GitHub API。
#   · 事件只是门铃:每次运行都把所有开着的 PR 全重算一遍(见 gate/run.mjs 文件头)。
#     关卡读的每样输入变了都要有门铃(对照表见 gate/README.md「每样输入的门铃」):
#     推送 / 开关 PR / 改目标分支(edited,改标题正文时顺带重算一次,无害)/ 关闭(同一提交上少了一个 PR)、
#     CI 开跑与跑完(workflow_run requested / in_progress / completed;重跑不一定发 requested,开始跑时会发 in_progress)、
#     评审提交 / 改写 / 撤销(aiwork-review-ping);
#     给 PR 加标签(如 `aiwork:recheck`)也能手动重算;加合并标签 `aiwork:merge` 就是请关卡在放行时合并
#     (见 gate/README.md「合并」)。
#   · 发检查结果、合并用 aiwork-gate App 的私钥,放在只许 main 用的 environment `aiwork-gate` 里:
#     同仓库分支的 PR 能拿到仓库级 secrets,拿不到只许 main 的 environment secrets。
#   · 唯一的写权限 statuses: write 给保险丝(commit status `aiwork-gate/fuse`):App 私钥坏了时 App 改不了
#     自己发过的旧 success,由保险丝挡住(见 gate/run.mjs 文件头)。
#
# 检查名在本仓库 .aiwork/policy.json 的 check_name。shadow 阶段叫 `aiwork-gate-shadow`、只报不拦。
# 转真拦截的步骤见 gate/README.md「从 shadow 转为真拦截」。

name: aiwork-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed, labeled, edited]
  workflow_run:
    workflows: [ci, aiwork-review-ping]
    types: [requested, in_progress, completed]

permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: read
  statuses: write

# 同一时间只有一次运行:组名固定(不随事件变),不取消正在跑的;排队的只留最新一个,它开始时读到的一定不比
# 被它顶掉的旧。所以同一提交上后写的结论一定出自后读的数据。每次运行都重算全部开着的 PR,顶掉的那些不会漏算。
concurrency:
  group: aiwork-gate
  cancel-in-progress: false

jobs:
  gate:
    # 不按事件过滤(比如只认某个标签):排队时被顶掉的运行要靠顶掉它的那次来算,那次不能被跳过
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aiwork-gate
    steps:
      - name: 检出本仓库 main 上的策略
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: caller
          persist-credentials: false

      - name: 检出 aiwork main 上的关卡代码
        uses: actions/checkout@v4
        with:
          repository: SunJ1ayu/aiwork
          ref: main
          path: aiwork
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 判
        working-directory: aiwork
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AIWORK_GATE_PRIVATE_KEY: ${{ secrets.AIWORK_GATE_PRIVATE_KEY }}
          AIWORK_POLICY_PATH: ${{ github.workspace }}/caller/.aiwork/policy.json
        run: node gate/main.mjs
